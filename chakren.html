<style>
  :root {
    --bg: #0c0d0f;
    --surface: #14151a;
    --surface2: #1c1d24;
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(255,255,255,0.14);
    --text: #e8e6e0;
    --muted: #7a7870;
    --c1: #e03c3c; --c1d: rgba(224,60,60,0.10);
    --c2: #e07c3c; --c2d: rgba(224,124,60,0.10);
    --c3: #d4c53a; --c3d: rgba(212,197,58,0.10);
    --c4: #4caf7d; --c4d: rgba(76,175,125,0.10);
    --c5: #3a9bd4; --c5d: rgba(58,155,212,0.10);
    --c6: #5a4dd4; --c6d: rgba(90,77,212,0.10);
    --c7: #9b59b6; --c7d: rgba(155,89,182,0.10);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.6;
  }

  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;
    border-bottom: 1px solid var(--border);
  }

  .nav-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 15px;
    color: var(--muted);
    text-decoration: none;
    letter-spacing: 0.02em;
  }

  .nav-logo span { color: #9b59b6; }

  .nav-back {
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: color 0.2s;
  }

  .nav-back:hover { color: var(--text); }

  header {
    position: relative;
    padding: 72px 0 56px;
    text-align: center;
    overflow: hidden;
  }

  .header-glow {
    position: absolute;
    top: -80px; left: 50%;
    transform: translateX(-50%);
    width: 600px; height: 300px;
    background: radial-gradient(ellipse, rgba(155,89,182,0.13) 0%, transparent 70%);
    pointer-events: none;
  }

  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(2.2rem, 5vw, 3.8rem);
    font-weight: 400;
    letter-spacing: -0.01em;
    color: var(--text);
    position: relative;
  }

  header h1 em { font-style: italic; color: #9b59b6; }

  header p {
    margin-top: 14px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    position: relative;
  }

  .header-line {
    width: 40px; height: 1px;
    background: #9b59b6;
    margin: 20px auto 0;
    opacity: 0.5;
  }

  /* Body map */
  .body-map-wrap {
    display: flex;
    justify-content: center;
    padding: 0 24px 48px;
  }

  .body-map {
    position: relative;
    width: 100px;
    height: 280px;
  }

  .body-map svg { position: absolute; top: 0; left: 0; }

  .chakra-dot {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 14px; height: 14px;
    border-radius: 50%;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    z-index: 2;
  }

  .chakra-dot:hover, .chakra-dot.active {
    transform: translateX(-50%) scale(1.5);
  }

  .list {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 20px 80px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .item {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    overflow: hidden;
    transition: border-color 0.2s;
    animation: fadeUp 0.4s ease both;
  }

  .item:hover { border-color: var(--border-hover); }

  .item-header {
    display: grid;
    grid-template-columns: 48px 1fr auto auto;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    cursor: pointer;
    user-select: none;
  }

  .chakra-orb {
    width: 38px; height: 38px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .item-info { display: flex; flex-direction: column; gap: 2px; }

  .item-name {
    font-family: 'DM Serif Display', serif;
    font-size: 17px;
    color: var(--text);
  }

  .item-sub { font-size: 12px; color: var(--muted); }

  .item-position {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 100px;
    white-space: nowrap;
    font-weight: 500;
  }

  .item-chevron {
    width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    transition: transform 0.25s, color 0.2s;
    flex-shrink: 0;
  }

  .item-chevron svg { display: block; }
  .item.open .item-chevron { transform: rotate(180deg); color: var(--text); }

  .item-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s cubic-bezier(0.4,0,0.2,1);
  }

  .item.open .item-body { max-height: 700px; }

  .item-body-inner {
    border-top: 1px solid var(--border);
    padding: 20px 20px 22px 20px;
    background: var(--surface2);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }

  .body-section { display: flex; flex-direction: column; gap: 5px; }
  .body-section.full { grid-column: 1 / -1; }

  .body-label {
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }

  .body-text {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.75;
  }

  .affirmation {
    font-family: 'DM Serif Display', serif;
    font-size: 15px;
    font-style: italic;
    padding: 12px 16px;
    border-radius: 8px;
    color: var(--text);
    margin-top: 4px;
  }

  .tags-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }

  .tag {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 100px;
    color: var(--muted);
    border: 1px solid var(--border);
  }

  footer {
    text-align: center;
    padding: 32px 24px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.04em;
    max-width: 760px;
    margin: 0 auto;
  }

  @keyframes fadeUp {
    from { opacity:0; transform:translateY(12px); }
    to { opacity:1; transform:translateY(0); }
  }

  @media (max-width: 560px) {
    .item-header { grid-template-columns: 40px 1fr auto; gap: 10px; }
    .item-position { display: none; }
    .item-body-inner { grid-template-columns: 1fr; }
    nav { padding: 14px 20px; }
  }
</style>
</head>

    blockiert: "Kreativitätsblockaden, Schuldgefühle rund um Sexualität, emotionale Taubheit, Suchtverhalten, Hüft- und Rückenschmerzen.",

    affirmation: "Ich fühle. Ich erschaffe. Ich lasse Freude zu.",
    oeffnen: ["Tanzen", "Kreatives Gestalten", "Wasser & Baden", "Orange Lebensmittel", "Hüftöffnende Yoga-Posen"]

  {

    zustaendig: "Liebe, Mitgefühl, Verbindung, Empathie, Vergebung. Brücke zwischen den unteren (materiellen) und oberen (spirituellen) Chakren.",
    koerper: "Herz, Lunge, Thymusdrüse, Arme, Hände, Schultergürtel.",
    blockiert: "Herzschmerz, Bitterkeit, Einsamkeit, Unfähigkeit zu lieben oder geliebt zu werden, Atemprobleme, Herzerkrankungen.",
    aktiviert: "Bedingungslose Liebe, Mitgefühl, Dankbarkeit, gesunde Beziehungen, Selbstliebe, emotionale Heilung.",

    blockiert: "Schwierigkeiten, sich auszudrücken, Lügen, Halsschmerzen, Schilddrüsenprobleme, Stottern, Kommunikationsangst.",
    aktiviert: "Klare Kommunikation, Ehrlichkeit, aktives Zuhören, Selbstausdruck durch Kunst und Sprache, innere Wahrheit.",

  {

    frequenz: "852 Hz",
    zustaendig: "Intuition, Weisheit, inneres Wissen, Vorstellungskraft, Wahrnehmung jenseits der Sinne. Das Dritte Auge.",
    koerper: "Gehirn, Augen, Zirbeldrüse, Hypothalamus, Hypophyse, Nervensystem.",
    blockiert: "Denkblockaden, Dogmatismus, fehlende Intuition, Kopfschmerzen, Schlafstörungen, Zirbeldrüsen-Verkalkung.",
    aktiviert: "Starke Intuition, klares Denken, Imagination, geistige Klarheit, tiefe Selbstkenntnis, innere Führung.",
    affirmation: "Ich vertraue meiner Intuition. Ich sehe klar.",
    oeffnen: ["Meditation", "Dunkelheit & Stille", "Blaue/violette Lebensmittel", "Traumtagebuch", "852 Hz Klang"]
  },
  {
    num: 7,
    name: "Kronenchakra",
    sanskrit: "Sahasrara",
    color: "#9b59b6",
    colorDim: "rgba(155,89,182,0.12)",
    symbol: "✨",
    position: "Scheitel",
    element: "Bewusstsein",
    frequenz: "963 Hz",
    zustaendig: "Spirituelle Verbindung, Einheit, Erleuchtung, kosmisches Bewusstsein. Verbindung mit dem Universum, dem Göttlichen oder dem höheren Selbst.",
    koerper: "Gehirn (Kortex), Zentralnervensystem, Zirbeldrüse, gesamtes Energiesystem.",
    blockiert: "Spirituelle Leere, Dogmatismus, Verbindungslosigkeit, Sinnlosigkeit, psychische Erschöpfung, depressive Zustände.",
    aktiviert: "Innerer Frieden, Verbundenheit mit allem, spirituelles Erwachen, Dankbarkeit, Weisheit, Transzendenz.",
    affirmation: "Ich bin verbunden. Ich vertraue dem Leben. Ich bin Licht.",
    oeffnen: ["Tiefe Stille & Kontemplation", "Fasten / Lichtnahrung", "Natur unter dem Sternenhimmel", "963 Hz Klang", "Dankbarkeit & Hingabe"]

const list = document.getElementById('list');

chakras.forEach((c, i) => {
  const div = document.createElement('div');
  div.className = 'item';
  div.id = `chakra-${c.num}`;
  div.style.animationDelay = (i * 0.06) + 's';
  div.style.borderColor = `rgba(${hexToRgb(c.color)}, 0.2)`;

  div.innerHTML = `
    <div class="item-header" role="button" aria-expanded="false" tabindex="0">
      <div class="chakra-orb" style="background:${c.colorDim}; box-shadow: 0 0 16px ${c.colorDim}">
        <span style="font-size:20px">${c.symbol}</span>
      </div>
      <div class="item-info">
        <div class="item-name">${c.name}</div>
        <div class="item-sub">${c.sanskrit} · Chakra ${c.num}</div>
      </div>
      <span class="item-position" style="background:${c.colorDim}; color:${c.color}">${c.position}</span>
      <span class="item-chevron" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M2 4.5L7 9.5L12 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
    </div>
    <div class="item-body">
      <div class="item-body-inner" style="border-left: 2px solid ${c.color}; padding-left: 18px;">
        <div class="body-section full">
          <div class="body-label">Zuständigkeit</div>
          <div class="body-text">${c.zustaendig}</div>
        </div>
        <div class="body-section">
          <div class="body-label">Körperliche Bereiche</div>
          <div class="body-text">${c.koerper}</div>
        </div>
        <div class="body-section">
          <div class="body-label">Element & Frequenz</div>
          <div class="body-text"><strong style="color:var(--text)">${c.element}</strong> · ${c.frequenz} Solfeggio</div>
        </div>
        <div class="body-section">
          <div class="body-label">Bei Blockierung</div>
          <div class="body-text">${c.blockiert}</div>
        </div>
        <div class="body-section">
          <div class="body-label">Bei Aktivierung</div>
          <div class="body-text">${c.aktiviert}</div>
        </div>
        <div class="body-section full">
          <div class="body-label">Affirmation</div>
          <div class="affirmation" style="background:${c.colorDim}; border-left: 2px solid ${c.color}">${c.affirmation}</div>
        </div>
        <div class="body-section full">
          <div class="body-label">Chakra öffnen</div>
          <div class="tags-wrap">
            ${c.oeffnen.map(t => `<span class="tag">${t}</span>`).join('')}
          </div>
        </div>
      </div>
    </div>`;

  const header = div.querySelector('.item-header');
  header.addEventListener('click', () => {
    const open = div.classList.toggle('open');
    header.setAttribute('aria-expanded', open);
    // update hover color
    div.style.borderColor = open ? `rgba(${hexToRgb(c.color)}, 0.5)` : `rgba(${hexToRgb(c.color)}, 0.2)`;
  });
  header.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); header.click(); }
  });

  list.appendChild(div);
});

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}
</script>
